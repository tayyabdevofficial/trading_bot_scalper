<!-- Bot Detail Modal -->
<div id="botDetailModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div class="modal-content glass-card" style="width: 90%; max-width: 600px; padding: 2rem; border-radius: 12px; position: relative;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600;"><i data-lucide="info" style="vertical-align: middle; margin-right: 6px; color: var(--accent-purple);"></i> Bot Instance Details</h2>
            <button onclick="closeBotDetails()" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <div class="modal-body" id="botDetailContent" style="max-height: 70vh; overflow-y: auto;">
            <!-- Injected dynamically -->
        </div>
    </div>
</div>
