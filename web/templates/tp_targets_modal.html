<!-- Take Profit Targets Modal -->
<div id="tpTargetsModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px);" onclick="if(event.target===this)closeTpTargetsModal()">
    <div class="modal-content glass-card" style="width: 90%; max-width: 420px; padding: 1.5rem; border-radius: 12px; position: relative;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom:0.5rem;">
            <h3 id="tpModalTitle" style="font-size: 1.1rem; font-weight: 600; color: #f8fafc;">Take Profit Targets</h3>
            <button onclick="closeTpTargetsModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; line-height:1;">&times;</button>
        </div>
        <div class="modal-body" id="tpModalContent" style="padding: 0.5rem 0;">
            <!-- Injected dynamically -->
        </div>
    </div>
</div>
